name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor packages
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor-mlkit/text-recognition

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin duplicate class conflict
        run: |
          cat >> android/build.gradle << 'GRADLE'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          GRADLE

      - name: Add Korean ML Kit OCR model
        run: |
          # 1. app/build.gradle 에 한글 모델 의존성 추가
          sed -i '/dependencies {/a\    implementation "com.google.mlkit:text-recognition-korean:16.0.1"' android/app/build.gradle

          # 2. AndroidManifest.xml 에 앱 설치 시 한글 모델 자동 다운로드 설정
          sed -i 's|</application>|    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr_kr"/>\n    </application>|' android/app/src/main/AndroidManifest.xml

          echo "--- app/build.gradle dependencies ---"
          grep -A5 "dependencies {" android/app/build.gradle | head -20
          echo "--- AndroidManifest.xml ---"
          grep -i "mlkit\|DEPENDENCIES" android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: damoa-pen-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ APK 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "APK: **Actions → 이 실행 → Artifacts → damoa-pen-debug**" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/
