name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor packages
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Kotlin duplicate class conflict
        run: |
          cat >> android/build.gradle << 'GRADLE'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          GRADLE

      - name: Verify app/build.gradle
        run: |
          echo "--- app/build.gradle dependencies ---"
          grep -A10 "dependencies {" android/app/build.gradle | head -20

      - name: Setup palm rejection (gesture exclusion) in MainActivity
        run: |
          # ML Kit 제거됨 — 팜리젝션(시스템 제스처 제외)만 유지
          true
          cat > /dev/null << 'JAVA'
          package com.damoa.pen;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mlkit.common.model.DownloadConditions;
          import com.google.mlkit.common.model.RemoteModelManager;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.digitalink.DigitalInkRecognition;
          import com.google.mlkit.vision.digitalink.DigitalInkRecognitionModel;
          import com.google.mlkit.vision.digitalink.DigitalInkRecognitionModelIdentifier;
          import com.google.mlkit.vision.digitalink.DigitalInkRecognizer;
          import com.google.mlkit.vision.digitalink.DigitalInkRecognizerOptions;
          import com.google.mlkit.vision.digitalink.Ink;
          import com.google.mlkit.vision.digitalink.RecognitionCandidate;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.korean.KoreanTextRecognizerOptions;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "InkRecognition")
          public class InkRecognitionPlugin extends Plugin {

              @PluginMethod
              public void recognize(PluginCall call) {
                  try {
                      JSArray strokesJs = call.getArray("strokes");
                      String langTag = call.getString("languageCode", "ko-KR");

                      Ink.Builder inkBuilder = Ink.builder();
                      for (int si = 0; si < strokesJs.length(); si++) {
                          JSONObject strokeObj = strokesJs.getJSONObject(si);
                          JSONArray ptsJs = strokeObj.getJSONArray("points");
                          Ink.Stroke.Builder sb = Ink.Stroke.builder();
                          for (int pi = 0; pi < ptsJs.length(); pi++) {
                              JSONObject pt = ptsJs.getJSONObject(pi);
                              float x = (float) pt.getDouble("x");
                              float y = (float) pt.getDouble("y");
                              long t = pt.has("t") ? pt.getLong("t") : (long)(si * 1200 + pi * 16);
                              sb.addPoint(Ink.Point.create(x, y, t));
                          }
                          inkBuilder.addStroke(sb.build());
                      }
                      Ink ink = inkBuilder.build();

                      DigitalInkRecognitionModelIdentifier modelId =
                          DigitalInkRecognitionModelIdentifier.fromLanguageTag(langTag);
                      if (modelId == null) {
                          call.reject("지원하지 않는 언어: " + langTag);
                          return;
                      }

                      DigitalInkRecognitionModel model =
                          DigitalInkRecognitionModel.builder(modelId).build();
                      DigitalInkRecognizer recognizer =
                          DigitalInkRecognition.getClient(
                              DigitalInkRecognizerOptions.builder(model).build());

                      recognizer.recognize(ink)
                          .addOnSuccessListener(result -> {
                              JSObject ret = new JSObject();
                              JSArray candidates = new JSArray();
                              String topText = "";
                              for (RecognitionCandidate c : result.getCandidates()) {
                                  JSObject cObj = new JSObject();
                                  cObj.put("text", c.getText());
                                  if (c.getScore() != null) cObj.put("score", c.getScore());
                                  candidates.put(cObj);
                                  if (topText.isEmpty()) topText = c.getText();
                              }
                              ret.put("text", topText);
                              ret.put("candidates", candidates);
                              recognizer.close();
                              call.resolve(ret);
                          })
                          .addOnFailureListener(e -> {
                              recognizer.close();
                              // 모델 미다운로드 시 자동 다운로드 후 재시도
                              RemoteModelManager manager = RemoteModelManager.getInstance();
                              manager.download(model, new DownloadConditions.Builder().build())
                                  .addOnSuccessListener(v -> {
                                      DigitalInkRecognizer r2 = DigitalInkRecognition.getClient(
                                          DigitalInkRecognizerOptions.builder(model).build());
                                      r2.recognize(ink)
                                          .addOnSuccessListener(result2 -> {
                                              JSObject ret2 = new JSObject();
                                              String top2 = result2.getCandidates().isEmpty()
                                                  ? "" : result2.getCandidates().get(0).getText();
                                              ret2.put("text", top2);
                                              r2.close();
                                              call.resolve(ret2);
                                          })
                                          .addOnFailureListener(e2 -> {
                                              r2.close();
                                              call.reject(e2.getMessage());
                                          });
                                  })
                                  .addOnFailureListener(e2 ->
                                      call.reject("모델 다운로드 실패: " + e2.getMessage()));
                          });
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void recognizeImage(PluginCall call) {
                  try {
                      String base64 = call.getString("imageBase64");
                      if (base64 == null || base64.isEmpty()) {
                          call.reject("imageBase64 필요");
                          return;
                      }
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      Bitmap bitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bitmap == null) {
                          call.reject("이미지 디코딩 실패");
                          return;
                      }
                      InputImage image = InputImage.fromBitmap(bitmap, 0);
                      TextRecognizer recognizer = TextRecognition.getClient(
                          new KoreanTextRecognizerOptions.Builder().build());
                      recognizer.process(image)
                          .addOnSuccessListener(result -> {
                              JSObject ret = new JSObject();
                              ret.put("text", result.getText());
                              recognizer.close();
                              bitmap.recycle();
                              call.resolve(ret);
                          })
                          .addOnFailureListener(e -> {
                              recognizer.close();
                              bitmap.recycle();
                              call.reject(e.getMessage());
                          });
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }

              @PluginMethod
              public void downloadModel(PluginCall call) {
                  try {
                      String langTag = call.getString("languageCode", "ko-KR");
                      DigitalInkRecognitionModelIdentifier modelId =
                          DigitalInkRecognitionModelIdentifier.fromLanguageTag(langTag);
                      if (modelId == null) { call.reject("지원하지 않는 언어"); return; }

                      DigitalInkRecognitionModel model =
                          DigitalInkRecognitionModel.builder(modelId).build();
                      RemoteModelManager.getInstance()
                          .download(model, new DownloadConditions.Builder().build())
                          .addOnSuccessListener(v -> {
                              JSObject ret = new JSObject();
                              ret.put("downloaded", true);
                              call.resolve(ret);
                          })
                          .addOnFailureListener(e -> call.reject(e.getMessage()));
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }
          }
          JAVA

          # (placeholder — plugin removed)
          echo "ML Kit plugin 제거됨"

      - name: Apply palm rejection (gesture exclusion) in MainActivity
        run: |
          MAIN="android/app/src/main/java/com/damoa/pen/MainActivity.java"
          python3 << 'PYEOF'
          import re

          path = "android/app/src/main/java/com/damoa/pen/MainActivity.java"
          with open(path, "r") as f:
              content = f.read()

          # OnGlobalLayoutListener로 WebView 실제 크기 확보 후 제스처 제외 적용
          gesture_exclusion = (
              "        // 팜리젝션 — 레이아웃 완료 후 전체 화면을 시스템 제스처 제외 영역으로 설정 (Android 10+)\n"
              "        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {\n"
              "            android.view.View wv = getBridge().getWebView();\n"
              "            wv.getViewTreeObserver().addOnGlobalLayoutListener(\n"
              "                new android.view.ViewTreeObserver.OnGlobalLayoutListener() {\n"
              "                    @Override public void onGlobalLayout() {\n"
              "                        if (wv.getWidth() > 0 && wv.getHeight() > 0) {\n"
              "                            java.util.List<android.graphics.Rect> rects = new java.util.ArrayList<>();\n"
              "                            rects.add(new android.graphics.Rect(0, 0, wv.getWidth(), wv.getHeight()));\n"
              "                            wv.setSystemGestureExclusionRects(rects);\n"
              "                            wv.getViewTreeObserver().removeOnGlobalLayoutListener(this);\n"
              "                        }\n"
              "                    }\n"
              "                });\n"
              "        }\n"
          )

          if "setSystemGestureExclusionRects" in content:
              print("이미 적용됨, 스킵")
          elif "super.onCreate" in content:
              content = content.replace(
                  "super.onCreate(savedInstanceState);",
                  "super.onCreate(savedInstanceState);\n" + gesture_exclusion
              )
          else:
              content = re.sub(
                  r'(public class MainActivity extends BridgeActivity\s*\{)',
                  r'\1\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n' + gesture_exclusion.replace('\\', '\\\\') + '    }',
                  content
              )

          with open(path, "w") as f:
              f.write(content)
          print("팜리젝션 적용 완료")
          PYEOF
          echo "--- 수정된 MainActivity.java ---"
          cat "$MAIN"

      - name: Apply sticky immersive mode (하단 홈 제스처 팜 오인식 방지)
        run: |
          # Android 시스템은 setSystemGestureExclusionRects로 하단 홈 제스처 영역을 제외할 수 없음.
          # Sticky Immersive Mode로 내비게이션 바 자체를 숨겨야 손바닥 해제 시 홈으로 나가는 현상을 막을 수 있음.
          # onCreate + onWindowFocusChanged 양쪽에서 호출해야 앱 시작 시 즉시 숨겨지고 포커스 복귀 시에도 유지됨.
          python3 << 'PYEOF'
          path = "android/app/src/main/java/com/damoa/pen/MainActivity.java"
          with open(path, "r") as f:
              content = f.read()

          if "setupImmersiveMode" in content:
              print("이미 적용됨, 스킵")
          else:
              immersive_methods = (
                  "\n    // Sticky Immersive Mode: 내비게이션 바 숨김 → 하단 팜 오인식 홈 제스처 방지\n"
                  "    private void setupImmersiveMode() {\n"
                  "        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {\n"
                  "            android.view.WindowInsetsController ctrl = getWindow().getInsetsController();\n"
                  "            if (ctrl != null) {\n"
                  "                ctrl.hide(android.view.WindowInsets.Type.navigationBars());\n"
                  "                ctrl.setSystemBarsBehavior(\n"
                  "                    android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n"
                  "            }\n"
                  "        } else {\n"
                  "            getWindow().getDecorView().setSystemUiVisibility(\n"
                  "                android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n"
                  "                | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);\n"
                  "        }\n"
                  "    }\n\n"
                  "    @Override\n"
                  "    public void onWindowFocusChanged(boolean hasFocus) {\n"
                  "        super.onWindowFocusChanged(hasFocus);\n"
                  "        if (hasFocus) setupImmersiveMode();\n"
                  "    }\n"
              )
              # 클래스 마지막 } 앞에 메서드 삽입
              last_brace = content.rfind("}")
              content = content[:last_brace] + immersive_methods + content[last_brace:]

              # onCreate 안에서도 즉시 호출: 제스처 제외 블록 바로 뒤에 삽입
              # 팜리젝션 스텝이 삽입한 블록의 끝 부분을 앵커로 사용
              close_block = "                });\n        }\n"  # 실제 들여쓰기 16칸
              if "setSystemGestureExclusionRects" in content:
                  anchor_pos = content.find("setSystemGestureExclusionRects")
                  close_pos  = content.find(close_block, anchor_pos)
                  if close_pos != -1:
                      insert_at = close_pos + len(close_block)
                      content = content[:insert_at] + "        setupImmersiveMode();\n" + content[insert_at:]
                      print("onCreate 내 setupImmersiveMode() 호출 삽입 완료")
              else:
                  # 제스처 제외 코드가 없는 경우 super.onCreate 바로 뒤에 삽입
                  content = content.replace(
                      "super.onCreate(savedInstanceState);",
                      "super.onCreate(savedInstanceState);\n        setupImmersiveMode();",
                      1
                  )

              with open(path, "w") as f:
                  f.write(content)
              print("Sticky Immersive Mode 적용 완료")
          PYEOF
          echo "--- 최종 MainActivity.java ---"
          cat android/app/src/main/java/com/damoa/pen/MainActivity.java

      - name: Generate app icons from resources/icon.png
        run: |
          pip install Pillow --break-system-packages -q
          python3 << 'PYEOF'
          from PIL import Image
          import os

          icon = Image.open("resources/icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi":    48,
              "mipmap-hdpi":    72,
              "mipmap-xhdpi":   96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }
          # 어댑티브 아이콘 foreground 크기 (108dp 기준)
          fg_sizes = {
              "mipmap-mdpi":    108,
              "mipmap-hdpi":    162,
              "mipmap-xhdpi":   216,
              "mipmap-xxhdpi":  324,
              "mipmap-xxxhdpi": 432,
          }

          base = "android/app/src/main/res"
          for folder, size in sizes.items():
              out_dir = os.path.join(base, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = icon.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
              # 어댑티브 아이콘 foreground도 교체 (Android 8+ 기기에서 실제로 보이는 아이콘)
              fg_size = fg_sizes[folder]
              fg = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              inner = icon.resize((int(fg_size * 0.75), int(fg_size * 0.75)), Image.LANCZOS)
              offset = (fg_size - inner.width) // 2
              fg.paste(inner, (offset, offset), inner)
              fg.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")
              print(f"  {folder}: {size}x{size} (fg: {fg_size}x{fg_size})")

          print("✅ 아이콘 생성 완료")
          PYEOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          echo "✅ Keystore decoded ($(wc -c < android/app/release.jks) bytes)"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Re-sign APK with persistent keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -1)
          echo "apksigner: $APKSIGNER"

          INPUT="android/app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="android/app/build/outputs/apk/debug/app-signed.apk"

          $APKSIGNER sign \
            --ks android/app/release.jks \
            --ks-pass pass:$STORE_PASSWORD \
            --ks-key-alias $KEY_ALIAS \
            --key-pass pass:$KEY_PASSWORD \
            --out $OUTPUT \
            $INPUT

          echo "✅ Re-signed: $(ls -lh $OUTPUT)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: damoa-pen-release
          path: android/app/build/outputs/apk/debug/app-signed.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ APK 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "- 서명: 고정 keystore (패키지 충돌 없음)" >> $GITHUB_STEP_SUMMARY
          echo "- ML Kit Digital Ink Recognition (한글 필기 인식, 오프라인)" >> $GITHUB_STEP_SUMMARY
          echo "APK: **Actions → 이 실행 → Artifacts → damoa-pen-release**" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/debug/
